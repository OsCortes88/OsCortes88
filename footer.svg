<svg width="900" height="100" viewBox="0 0 900 100" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgFooter" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004D98"/>
      <stop offset="100%" stop-color="#A50044"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="100" fill="url(#bgFooter)"/>

  <!-- Wave layer 1 (garnet, back) -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="0,0; -300,0; 0,0" dur="10s" repeatCount="indefinite"/>
    <path d="M-300,60 C-225,40 -150,40 -75,60 C0,80 75,80 150,60
             C225,40 300,40 375,60 C450,80 525,80 600,60
             C675,40 750,40 825,60 C900,80 975,80 1050,60
             C1125,40 1200,40 1275,60 L1275,110 L-300,110 Z"
      fill="#A50044" opacity="0.85"/>
  </g>

  <!-- Wave layer 2 (blue, front) -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="0,0; 300,0; 0,0" dur="8s" repeatCount="indefinite"/>
    <path d="M-300,70 C-225,90 -150,90 -75,70 C0,50 75,50 150,70
             C225,90 300,90 375,70 C450,50 525,50 600,70
             C675,90 750,90 825,70 C900,50 975,50 1050,70
             C1125,90 1200,90 1275,70 L1275,110 L-300,110 Z"
      fill="#004D98" opacity="0.9"/>
  </g>

  <!-- Gold accent line (on top of waves) -->
  <rect x="0" y="94" width="900" height="6" fill="#EDBB00"/>
</svg>
