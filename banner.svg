<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#004D98"/>
      <stop offset="100%" stop-color="#A50044"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Gold accent lines -->
  <rect x="0" y="0" width="900" height="6" fill="#EDBB00"/>
  <rect x="0" y="194" width="900" height="6" fill="#EDBB00"/>

  <!-- Wave layer 1 (garnet, back) -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="0,0; -300,0; 0,0" dur="10s" repeatCount="indefinite"/>
    <path d="M-300,140 C-225,110 -150,110 -75,140 C0,170 75,170 150,140
             C225,110 300,110 375,140 C450,170 525,170 600,140
             C675,110 750,110 825,140 C900,170 975,170 1050,140
             C1125,110 1200,110 1275,140 L1275,220 L-300,220 Z"
      fill="#A50044" opacity="0.85"/>
  </g>

  <!-- Wave layer 2 (blue, front) -->
  <g>
    <animateTransform attributeName="transform" attributeType="XML" type="translate"
      values="0,0; 300,0; 0,0" dur="8s" repeatCount="indefinite"/>
    <path d="M-300,160 C-225,190 -150,190 -75,160 C0,130 75,130 150,160
             C225,190 300,190 375,160 C450,130 525,130 600,160
             C675,190 750,190 825,160 C900,130 975,130 1050,160
             C1125,190 1200,190 1275,160 L1275,220 L-300,220 Z"
      fill="#004D98" opacity="0.9"/>
  </g>

  <!-- Name -->
  <text x="450" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="46"
    font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#softShadow)">
    Oswaldo Cortes-Tinoco
  </text>

  <!-- Subtitle -->
  <text x="450" y="130" font-family="Verdana, sans-serif" font-size="20"
    fill="#EDBB00" text-anchor="middle" letter-spacing="2" filter="url(#softShadow)">
    SOFTWARE ENGINEER
  </text>
</svg>
